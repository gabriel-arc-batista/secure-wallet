spring.application.name=secure-wallet
spring.datasource.url=jdbc:postgresql://localhost:5432/secure_wallet
spring.datasource.username=secure_wallet_app
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=7200
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
