services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_wallet
      POSTGRES_USER: secure_wallet_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_wallet_app -d secure_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/secure_wallet
      SPRING_DATASOURCE_USERNAME: secure_wallet_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
